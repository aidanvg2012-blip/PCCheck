name: Build and publish PCCheck Windows x64
on:
  push:
    tags:
      - 'desktop-v*'
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund --ignore-scripts=false
      - name: Build Windows x64 installer
        run: npm run desktop:build:win
      - name: Publish installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: PCCheck Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
